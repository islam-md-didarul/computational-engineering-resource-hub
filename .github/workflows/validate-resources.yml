name: Validate resource library

on:
  pull_request:
    paths:
      - "README.md"
      - "data/resources.json"
      - "scripts/generate_readme.py"
      - "scripts/validate_resources.py"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "data/resources.json"
      - "scripts/generate_readme.py"
      - "scripts/validate_resources.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structured resource data
        run: python scripts/validate_resources.py

      - name: Verify README is synchronized
        run: |
          python scripts/generate_readme.py
          git diff --exit-code README.md

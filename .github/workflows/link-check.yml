name: Check links

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * 1"

  pull_request:
    paths:
      - "**/*.md"
      - "data/resources.json"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read

jobs:
  lychee:
    name: Check repository links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check repository links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept "200..=299,429"
            --exclude-loopback
            "**/*.md"
            "data/resources.json"
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
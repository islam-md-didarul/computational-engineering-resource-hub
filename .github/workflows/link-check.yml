name: Check external links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - "data/resources.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "data/resources.json"

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check repository links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --exclude-mail
            --exclude-loopback
            --exclude "github.com/islam-md-didarul"
            "**/*.md"
            "data/resources.json"
          fail: true
